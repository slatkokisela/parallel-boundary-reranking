[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pbar"
version = "0.1.0"
description = "Parallel Boundary-Aware Reranking: batch extensions of BoundaryMORPH"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.4",
  "sentence-transformers>=3.0",
  "numpy>=1.26",
  "scipy>=1.11",
  "pandas>=2.0",
  "pyyaml>=6.0",
  "tqdm",
]

[project.optional-dependencies]
dev = ["pytest>=8", "tabulate", "matplotlib"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
