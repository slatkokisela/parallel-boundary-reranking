# M1: first-stage + CE baselines. Run on dev first; test only for frozen configs.
name: baselines
seed: 0
split: dev            # override: python scripts/run.py configs/baselines.yaml --split test
max_queries: null     # set e.g. 20 for a smoke test
dataset: {name: nfcorpus, data_dir: data/raw}
cache_dir: cache
results_dir: results
pool_size: 1000
retriever:
  model: intfloat/e5-base-v2
  query_prefix: "query: "
  doc_prefix: "passage: "
  batch_size: 64
cross_encoder:
  model: cross-encoder/ms-marco-MiniLM-L-6-v2
  max_length: 512
  batch_size: 32
eval:
  k: [20, 50, 100]
  budgets: [10, 25, 50]
  ndcg_k: 10
  diffuse_min_rel: 20   # paper's "diffuse query" filter, fixed a priori
methods:
  - {name: mips}
  - {name: single_stage}
  - {name: full_ce}
